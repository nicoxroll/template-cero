<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 168" role="img" aria-label="Punto Cero Desarrollos">
  <!-- Lockup completo: isotipo + wordmark + regla. Para usos donde no hay HTML
       alrededor (adjuntos, firma de mail, favicon de terceros). Dentro del sitio
       el wordmark se compone con HTML —ver LogoMark.tsx + el <Link> del
       Header—, que respeta el tracking exacto y hereda el color del tema. -->
  <defs>
    <linearGradient id="pc-logo" x1="0" y1="0" x2="132" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E7C5C"/>
      <stop offset="0.55" stop-color="#2C5741"/>
      <stop offset="1" stop-color="#16351F"/>
    </linearGradient>
  </defs>

  <g stroke="url(#pc-logo)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10 47 L30 30 L50 47"/>
    <path d="M14 44 V78"/>
    <path d="M50 47 V78"/>
    <path d="M27 55 h9 v9 h-9 z"/>
    <path d="M58 78 V16 h14 v62"/>
    <path d="M65 16 V4"/>
    <path d="M80 78 V26 h10"/>
    <path d="M92 47 L106 34 L120 47"/>
    <path d="M96 45 V78"/>
    <path d="M120 47 V78"/>
    <path d="M103 57 h7 v7 h-7 z"/>
    <path d="M6 80 H126"/>
  </g>

  <!-- font-family con fallbacks: un SVG suelto no arrastra la webfont del
       sitio, así que fuera de él cae a la sans del sistema. -->
  <text x="66" y="112" text-anchor="middle" fill="#101512"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="1.5">PUNTO CERO</text>
  <text x="66" y="134" text-anchor="middle" fill="#101512"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="5.2">DESARROLLOS</text>

  <path d="M52 150 H80" stroke="#101512" stroke-width="2.5" stroke-linecap="round"/>
</svg>
