    <!-- Los hosts de imagen se resuelven antes de que el parser llegue al primer
         <img>: sin esto el DNS + TLS de cada uno cae dentro del camino critico
         del LCP, que en este sitio es una foto a sangre. -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://hoirqrkdgbmvpwutwuwj.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />
    <!-- La foto del hero es la imagen LCP del sitio. Sin este preload no empieza
         a bajar hasta que el navegador parsea el CSS, encuentra el
         background-image y recién ahí la pide: en una conexión media eso son
         cientos de milisegundos con la portada en negro. Debe mantenerse en
         sincronía con STORY_PHOTO_URL (src/components/home/story/frameSource.ts).
         `fetchpriority=high` la pone delante del resto de la cola. -->
    <link

      as="image"

    <script>
      // Anti-flash de tema (sin FOUC): corre síncrono antes del primer paint,
      // después del <meta name="theme-color"> de arriba (para poder actualizarlo).
      // Precedencia: localStorage > prefers-color-scheme del SO. Ver src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('tc-theme') || localStorage.getItem('pc-theme');
          var isDark =
            stored === 'dark' || stored === 'light'
              ? stored === 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0b0f0d' : '#10281d');
        } catch (e) {}
      })();
      // Anti-flash del modo de HERO (sin FOUC)
      (function () {
        try {
          var raw = localStorage.getItem('tc-skin') || localStorage.getItem('pc-skin');
          var mode = raw === 'video' || raw === 'tour' ? 'video' : 'imagen';
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Telón de entrada (INTRO-01) — el isotipo se dibuja trazo por trazo y
         después las dos hojas se abren hacia los costados.

         Vive en el HTML y lo anima CSS puro, NO React, por dos razones que no
         son de estilo:

           1. Un preloader que dependa del bundle puede dejar la página TAPADA
              PARA SIEMPRE si el JS no llega (red caída, chunk con error, un
              navegador que no soporta algo). Acá el telón se abre igual: el
              JavaScript solo sincroniza la entrada del hero y limpia el nodo.
           2. Al estar en el HTML ya pintado, cubre desde el primer frame. Si se
              montara desde React se vería un destello del contenido —y en las
              13 páginas prerenderizadas, la página entera— antes del telón.

         Los tiempos están duplicados en src/lib/pageIntro.ts: si se tocan acá,
         hay que tocarlos allá (ese archivo lo dice y explica por qué). */
      #pc-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        /* Nunca intercepta clicks: aunque algo saliera mal con la animación,
           el sitio de abajo queda usable. */
        pointer-events: none;
        animation: pc-intro-off 0.01s linear 1.75s forwards;
      }
      @keyframes pc-intro-off {
        to {
          visibility: hidden;
        }
      }

      /* 50.5% y no 50%: a anchos impares dos mitades exactas dejan una costura
         de medio píxel por la que se ve el fondo. Se superponen y no se nota. */
      #pc-intro .pc-intro__half {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50.5%;
        background: #0b0f0d;
        will-change: transform;
      }
      #pc-intro .pc-intro__half--l {
        left: 0;
        animation: pc-intro-l 0.7s cubic-bezier(0.76, 0, 0.24, 1) 1.05s forwards;
      }
      #pc-intro .pc-intro__half--r {
        right: 0;
        animation: pc-intro-r 0.7s cubic-bezier(0.76, 0, 0.24, 1) 1.05s forwards;
      }
      @keyframes pc-intro-l {
        to {
          transform: translateX(-100%);
        }
      }
      @keyframes pc-intro-r {
        to {
          transform: translateX(100%);
        }
      }

      #pc-intro .pc-intro__mark {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(190px, 44vw);
        height: auto;
        transform: translate(-50%, -50%);
        color: #a8c9b4;
        opacity: 0;
        animation:
          pc-intro-mark-in 0.4s ease-out 0.1s forwards,
          pc-intro-mark-out 0.3s ease-in 0.95s forwards;
      }
      @keyframes pc-intro-mark-in {
        to {
          opacity: 1;
        }
      }
      @keyframes pc-intro-mark-out {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.06);
        }
      }

      /* pathLength="1" en cada trazo normaliza largos muy distintos (la línea de
         base mide 120 unidades, una ventana 9): sin eso, con un dasharray fijo,
         los trazos cortos aparecerían recién sobre el final y de golpe. Con
         pathLength todos se dibujan en el mismo tiempo relativo. */
      #pc-intro .pc-intro__mark path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: pc-intro-draw 0.75s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      @keyframes pc-intro-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Un telón ES movimiento no pedido, y encima retrasa el contenido. Con la
         preferencia activada no se muestra en absoluto. pageIntro.ts consulta la
         misma media query para no dejar al hero esperando un telón que no está. */
      @media (prefers-reduced-motion: reduce) {
        #pc-intro {
          display: none;
        }
      }
    </style>
